<div class="container">
<h2>Portefeuille Clients</h2>
<p class="subtitle">{{ allClients().length }} dossiers actifs</p>
  <div *ngIf="loading()">Chargement...</div>
  <div *ngIf="error()" class="error">{{ error() }}</div>

  <table *ngIf="!loading() && displayedClients().length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Âge</th>
        <th>Ville</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let client of displayedClients()">
        <td>{{ client.clientId }}</td>
        <td>{{ client.nom }}</td>
        <td>{{ client.prenom }}</td>
        <td>{{ client.age }}</td>
<td><span class="ville-chip">{{ client.ville }}</span></td>
        <td>
<a class="analyser" [routerLink]="['/analyse', client.clientId]">Analyser</a>
          <button (click)="deleteClient(client.clientId)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination" *ngIf="!loading()">
    <button (click)="previousPage()" [disabled]="currentPage() === 1">← Précédent</button>
    <span>Page {{ currentPage() }} / {{ totalPages() }}</span>
    <button (click)="nextPage()" [disabled]="currentPage() === totalPages()">Suivant →</button>
  </div>

  <p *ngIf="!loading() && displayedClients().length === 0">Aucun client trouvé.</p>
</div>
